name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for syntax errors
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run test suite
        run: pytest -q

  build:
    name: End-to-end image build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the sample Python app through the factory
        run: |
          python docker_image_factory.py \
            --language python \
            --app-path test_apps/python_app \
            --image-name factory-ci-python \
            --image-tag ci \
            --skip-scan --skip-sign --skip-push

      - name: Start the built image and check its health endpoint
        run: |
          docker run -d --name factory-ci -p 8000:8000 factory-ci-python:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo "health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "app did not become healthy"
          docker logs factory-ci
          exit 1

      - name: Stop the container
        if: always()
        run: docker rm -f factory-ci || true

      - name: Upload build report and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-build-output
          path: |
            reports/
            metadata/
            logs/
          if-no-files-found: ignore
